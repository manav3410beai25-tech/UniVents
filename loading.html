<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="2;url=./index.html">
    <meta name="theme-color" content="#07111f" />
    <title>UniVents — Loading</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }
      body {
        overflow: hidden;
        color: #fff;
        background: #07111f;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .loading {
        position: relative;
        display: grid;
        min-height: 100svh;
        place-items: center;
        isolation: isolate;
        overflow: hidden;
      }
      .loading__video, .loading::before, .loading::after {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .loading__video {
        z-index: -2;
        object-fit: cover;
        object-position: center;
      }
      .loading::before {
        z-index: -1;
        content: "";
        background: linear-gradient(180deg, rgb(4 11 23 / 20%), rgb(4 11 23 / 42%) 55%, rgb(4 11 23 / 72%));
      }
      .loading__content {
        width: min(90vw, 440px);
        padding: clamp(2rem, 8vw, 3.5rem) 2rem;
        text-align: center;
        border: 1px solid rgb(255 255 255 / 25%);
        border-radius: 30px;
        background: linear-gradient(145deg, rgb(255 255 255 / 18%), rgb(255 255 255 / 7%));
        box-shadow: 0 24px 80px rgb(0 0 0 / 22%), inset 0 1px 0 rgb(255 255 255 / 24%);
        -webkit-backdrop-filter: blur(18px) saturate(145%);
        backdrop-filter: blur(18px) saturate(145%);
      }
      .loading__brand {
        margin: 0;
        font-size: clamp(2rem, 8vw, 3rem);
        font-weight: 800;
        letter-spacing: -0.06em;
      }
      .loading__tagline {
        margin: 0.65rem 0 1.8rem;
        color: rgb(255 255 255 / 78%);
        font-size: 0.95rem;
      }
      .loading__track {
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: rgb(255 255 255 / 24%);
      }
      .loading__progress {
        width: 100%;
        height: 100%;
        transform: scaleX(0);
        transform-origin: left;
        border-radius: inherit;
        background: #fff;
        animation: load 5s linear forwards;
      }
      @keyframes load { to { transform: scaleX(1); } }
      @media (prefers-reduced-motion: reduce) {
        .loading__progress { animation-duration: 5s; }
      }
    </style>
  </head>
  <body>
    <main class="loading" aria-label="UniVents loading">
      <video class="loading__video" autoplay muted loop playsinline aria-hidden="true">
        <source src="./videos/anime-sky.mp4" type="video/mp4" />
      </video>
      <section class="loading__content">
        <h1 class="loading__brand">UniVents</h1>
        <p class="loading__tagline">One Campus. Every Event.</p>
        <div class="loading__track" role="progressbar" aria-label="Loading UniVents">
          <div class="loading__progress"></div>
        </div>
      </section>
    </main>
  </body>
</html>
